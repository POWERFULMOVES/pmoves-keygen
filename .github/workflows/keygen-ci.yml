name: keygen-ci

# The fork carried charmbracelet's reusable-workflow shims and nothing of its own,
# so cmd/keygen-cli landed with tests that never ran on a pull request. This is the
# repo's own gate. It is deliberately stronger than a generic Go CI copy: this repo
# GENERATES KEY MATERIAL, so the build is not the interesting assertion -- the file
# mode of the private key is.

on:
  pull_request:
    branches: [PMOVES.AI-Edition-Hardened, master]
  push:
    branches: [PMOVES.AI-Edition-Hardened, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keygen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: keygen-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: gofmt (fail on unformatted)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports files needing formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

      # Kept inside THIS gate rather than relying on the upstream build.yml shim:
      # build.yml already runs govulncheck, but it is charmbracelet's reusable
      # workflow, so a future sync can change it. This repo generates key material,
      # so a reachable advisory is a repo-level property, not an upstream courtesy.
      # It is not hypothetical - GO-2026-5018 (DoS via pathological RSA/DSA
      # parameters in golang.org/x/crypto/ssh) was reachable through keygen.New ->
      # ssh.ParseRawPrivateKey* at x/crypto v0.48.0 and failed the shim for two runs
      # before x/crypto v0.52.0 closed it.
      - name: govulncheck
        # GOTOOLCHAIN=local is what the upstream charmbracelet/meta shim uses, and it is
        # exactly what broke there: `@latest` now resolves to golang.org/x/vuln v1.8.0,
        # which requires go >= 1.26.0, so the install dies on the runner's 1.25.x with
        # "requires go >= 1.26.0 (running go 1.25.14; GOTOOLCHAIN=local)".
        #
        # Scoped to THIS step on purpose: `auto` lets the toolchain move for the vuln
        # tool, which is a scan harness rather than the artifact. The gofmt/vet/build/
        # test/key-mode steps above stay on the repo's declared language version, which
        # is what actually ships.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The assertion this repo actually needs. A keygen tool's failure mode is not a
      # compile error -- it is a private key on disk with the wrong permissions, or an
      # unencrypted key written where an encrypted one was intended. Neither shows up
      # in `go build`.
      - name: key-mode smoke (private key must land 0600)
        run: |
          set -eu
          workdir="$(mktemp -d)"
          go build -o "$workdir/keygen-cli" ./cmd/keygen-cli
          "$workdir/keygen-cli" "$workdir/id_ed25519" ed25519 > "$workdir/out.txt"
          test -f "$workdir/id_ed25519"           || { echo "FAIL: private key was not written"; exit 1; }
          test -f "$workdir/id_ed25519.pub"       || { echo "FAIL: public key was not written";  exit 1; }
          mode="$(stat -c '%a' "$workdir/id_ed25519")"
          test "$mode" = "600"                    || { echo "FAIL: private key mode is $mode, expected 600"; exit 1; }
          grep -q '^fingerprint=SHA256:' "$workdir/out.txt" || { echo "FAIL: no SHA256 fingerprint emitted"; exit 1; }
          grep -q '^encrypted=false'     "$workdir/out.txt" || { echo "FAIL: encrypted state not reported";  exit 1; }

      - name: bad key type must exit non-zero, not panic
        run: |
          set -eu
          workdir="$(mktemp -d)"
          go build -o "$workdir/keygen-cli" ./cmd/keygen-cli
          set +e
          "$workdir/keygen-cli" "$workdir/id_bogus" bogus > /dev/null 2> "$workdir/err.txt"
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo "FAIL: unsupported key type exited 0"; exit 1; }
          if grep -qi 'panic' "$workdir/err.txt"; then
            echo "FAIL: unsupported key type panicked instead of reporting"; exit 1
          fi

      - name: blank KEYGEN_PASSPHRASE must warn (not fail silently)
        run: |
          set -eu
          workdir="$(mktemp -d)"
          go build -o "$workdir/keygen-cli" ./cmd/keygen-cli
          KEYGEN_PASSPHRASE="" "$workdir/keygen-cli" "$workdir/id_blank" ed25519 > "$workdir/out.txt" 2> "$workdir/err.txt"
          grep -q '^encrypted=true' "$workdir/out.txt" && { echo "NOTE: blank passphrase produced an encrypted key"; exit 0; }
          grep -qi 'WARNING' "$workdir/err.txt" \
            || { echo "FAIL: blank passphrase wrote an unencrypted key with no warning"; exit 1; }
